[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Quickstart example for building voice AI bots with Pipecat"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.109.2",
    "google-genai>=1.73.1",
    "pipecat-ai-flows>=0.0.21",
    "pipecat-ai[assemblyai,cartesia,daily,deepgram,elevenlabs,google,groq,local-smart-turn-v3,rnnoise,runner,silero,webrtc,xai]>=0.0.86",
    "pipecatcloud>=0.2.4",
    "livekit>=0.14.0",
    "livekit-api>=0.7.0",
    "livekit-agents>=1.8.6",
    "livekit-plugins-google>=1.7.0",
    "livekit-plugins-silero>=1.8.6",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
